[project]
name = "component-google-my-business"
version = "0.1.0"
description = "Keboola Google My Business extractor"
requires-python = "~=3.13.0"
dependencies = [
    "backoff>=2.2.1",
    "dateparser>=1.4.0",
    "keboola-component>=1.10.0",
    "keboola-csvwriter>=1.0.1",
    "ratelimit>=2.2.1",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mock>=5.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
